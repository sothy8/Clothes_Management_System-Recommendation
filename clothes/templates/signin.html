{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In Form</title>
    <link rel="stylesheet" href="{% static 'profile/signin.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Animated Background -->
    <div class="background-animation">
        <div class="floating-shape shape-1"></div>
        <div class="floating-shape shape-2"></div>
        <div class="floating-shape shape-3"></div>
        <div class="floating-shape shape-4"></div>
        <div class="floating-shape shape-5"></div>
        <div class="floating-shape shape-6"></div>
    </div>

    <a href="{% url 'home' %}" class="button back-home">◀︎</a>
    <form method="POST" action="{% url 'signin' %}">
        {% csrf_token %}
        <div class="headingsContainer">
            <h3>Sign in</h3>
            <h4>Sign in with your username and password</h4>
        </div>
    
        <!-- Display error messages -->
        {% if form.errors %}
            <div class="error-message">
                <p>Invalid username or password. Please try again.</p>
            </div>
        {% endif %}
    
        <div class="mainContainer">
            <!-- Username -->
            <label for="username">Your username</label>
            {{ form.username }}
    
            <br><br>
    
            <!-- Password -->
            <label for="password">Your password</label>
            {{ form.password }}
    
            <!-- Sub container for the checkbox and forgot password link -->
            <div class="subcontainer">
                <label>
                    <input type="checkbox" name="remember"> Remember me
                </label>
                <p class="forgotpsd"><a href="#">Forgot Password?</a></p>
            </div>
    
            <!-- Submit button -->
            <button type="submit">Login</button>
    
            <!-- Sign up link -->
            <p class="register">Not a member? <a href="{% url 'signup' %}">Register here!</a></p>
        </div>
    </form>
    <script>
        function validateForm() {
            const username = document.getElementById('id_username').value;
            const password = document.getElementById('id_password').value;
            if (username === '' || password === '') {
                alert('Username and password are required.');
                return false;
            }
            return true;
        }
    </script>
</body>
</html>
